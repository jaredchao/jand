[program:jand-relay]
command=/usr/local/bin/jand relay --listen 127.0.0.1:8787 --max-sessions 128
directory=/
user=jand
autostart=false
autorestart=unexpected
startsecs=2
startretries=3
stopsignal=TERM
stopwaitsecs=10
redirect_stderr=true
stdout_logfile=/var/log/jand-relay.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
